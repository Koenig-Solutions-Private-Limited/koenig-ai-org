<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">US tech posting experience requirements shifted toward senior candidates from Q2 2022 to Q2 2025</title>
  <desc id="desc">Grouped bar chart using Indeed Hiring Lab data: one year or less stayed near 17 to 18 percent, two to four years fell from 46 to 40 percent, and five years or more rose from 37 to 42 percent.</desc>
  <rect width="960" height="560" fill="#f8fafc"/>
  <text x="72" y="58" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="700" fill="#102033">Experience requirements tightened in tech postings</text>
  <text x="72" y="90" font-family="Inter, Arial, sans-serif" font-size="16" fill="#475569">Share of US tech postings that mentioned experience requirements, Q2 2022 vs Q2 2025</text>
  <line x1="96" y1="440" x2="864" y2="440" stroke="#94a3b8" stroke-width="2"/>
  <line x1="96" y1="120" x2="96" y2="440" stroke="#94a3b8" stroke-width="2"/>
  <g font-family="Inter, Arial, sans-serif" font-size="13" fill="#475569">
    <text x="62" y="444">0%</text>
    <text x="55" y="380">10%</text>
    <text x="55" y="316">20%</text>
    <text x="55" y="252">30%</text>
    <text x="55" y="188">40%</text>
    <text x="55" y="124">50%</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1">
    <line x1="96" y1="376" x2="864" y2="376"/>
    <line x1="96" y1="312" x2="864" y2="312"/>
    <line x1="96" y1="248" x2="864" y2="248"/>
    <line x1="96" y1="184" x2="864" y2="184"/>
    <line x1="96" y1="120" x2="864" y2="120"/>
  </g>
  <g>
    <rect x="177" y="331" width="64" height="109" rx="3" fill="#2563eb"/>
    <rect x="249" y="325" width="64" height="115" rx="3" fill="#10b981"/>
    <rect x="423" y="146" width="64" height="294" rx="3" fill="#2563eb"/>
    <rect x="495" y="184" width="64" height="256" rx="3" fill="#10b981"/>
    <rect x="669" y="203" width="64" height="237" rx="3" fill="#2563eb"/>
    <rect x="741" y="171" width="64" height="269" rx="3" fill="#10b981"/>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#102033" text-anchor="middle">
    <text x="209" y="320">17%</text>
    <text x="281" y="314">18%</text>
    <text x="455" y="135">46%</text>
    <text x="527" y="173">40%</text>
    <text x="701" y="192">37%</text>
    <text x="773" y="160">42%</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="15" fill="#334155" text-anchor="middle">
    <text x="245" y="478">1 year or less</text>
    <text x="491" y="478">2 to 4 years</text>
    <text x="737" y="478">5 years or more</text>
  </g>
  <g font-family="Inter, Arial, sans-serif" font-size="14" fill="#334155">
    <rect x="654" y="70" width="18" height="18" rx="2" fill="#2563eb"/>
    <text x="680" y="84">Q2 2022</text>
    <rect x="754" y="70" width="18" height="18" rx="2" fill="#10b981"/>
    <text x="780" y="84">Q2 2025</text>
  </g>
  <text x="72" y="526" font-family="Inter, Arial, sans-serif" font-size="13" fill="#64748b">Source: Indeed Hiring Lab, "Experience Requirements Have Tightened Amid the Tech Hiring Freeze," retrieved 2026-07-28.</text>
</svg>
