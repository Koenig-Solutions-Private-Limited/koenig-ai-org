<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Business analyst hybrid skills chart for 2026</title>
  <desc id="desc">A bar chart comparing adjacent analyst posting signals for communication, SQL, Excel, Python, Tableau, and Power BI.</desc>
  <rect width="1200" height="675" fill="#f7f9fb"/>
  <rect x="80" y="78" width="1040" height="520" rx="0" fill="#ffffff" stroke="#d7dee8"/>
  <text x="120" y="138" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#172033">The 2026 BA Skill Mix Is Hybrid</text>
  <text x="120" y="178" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#516070">Adjacent analyst postings show data tools rising beside stakeholder communication.</text>
  <line x1="120" y1="526" x2="1040" y2="526" stroke="#c8d2df" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#374151">
    <text x="120" y="558">Communication</text>
    <text x="290" y="558">SQL</text>
    <text x="435" y="558">Excel</text>
    <text x="580" y="558">Python</text>
    <text x="725" y="558">Tableau</text>
    <text x="875" y="558">Power BI</text>
  </g>
  <g>
    <rect x="130" y="250" width="90" height="276" fill="#1f7a8c"/>
    <rect x="295" y="296" width="90" height="230" fill="#b83280"/>
    <rect x="450" y="336" width="90" height="190" fill="#f59e0b"/>
    <rect x="600" y="374" width="90" height="152" fill="#2f855a"/>
    <rect x="750" y="397" width="90" height="129" fill="#6b46c1"/>
    <rect x="905" y="412" width="90" height="114" fill="#2563eb"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#172033" text-anchor="middle">
    <text x="175" y="232">~60%</text>
    <text x="340" y="278">50%</text>
    <text x="495" y="318">41.3%</text>
    <text x="645" y="356">33%</text>
    <text x="795" y="379">28.1%</text>
    <text x="950" y="394">24.7%</text>
  </g>
  <text x="120" y="624" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#667085">Source note: 1,355 U.S. data analyst postings, April 2026; used as adjacent-role evidence, not BA-specific demand.</text>
</svg>
